<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Literatura Precolombina y Descubrimiento de América</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Cuestionario: Literatura Precolombina y Descubrimiento  de America</legend>
            <label for="autor">Nombre del estudiante / investigador:</label><br>
            <input type="text" id="autor" name="autor" placeholder="Ej. Juan Pérez"><br><br>
            <label for="buscar">Buscar obra o crónica:</label><br>
            <input type="search" id="buscar" name="buscar" placeholder="Ej. Popol Vuh, Diarios de Colón"><br><br>
            <label for="correo">Correo de contacto:</label>
            <input type="email" id="correo" name="correo" placeholder="estudiante@dominio.com">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" value="+503 68376370"><br><br>
            <label for="siglo">Siglo de estudio (Numérico):</label><br>
            <input type="number" id="siglo" name="siglo" min="1" max="21" placeholder="Ej. 15"><br><br>
            <label for="importancia">Nivel de impacto cultural (1 a 100):</label><br>
            <input type="range" id="importancia" name="importancia" min="1" max="100"><br><br>
            <label for="fecha_llegada">Fecha del Descubrimiento de América:</label>
            <input type="date" id="fecha_llegada" name="fecha_llegada"><br><br>
            <label for="hora_lectura">Hora programada de lectura:</label>
            <input type="time" id="hora_lectura" name="hora_lectura"><br><br>
            <label for="mes_entrega">Mes de entrega del informe:</label>
            <input type="month" id="mes_entrega" name="mes_entrega"><br><br>
            <label for="semana_analisis">Semana de análisis histórico:</label>
            <input type="week" id="semana_analisis" name="semana_analisis"><br><br>
            <label>Cultura precolombina de interés:</label><br>
            <input type="checkbox" id="maya" name="cultura" value="maya">
            <label for="maya">Maya (Popol Vuh / Chilam Balam)</label><br>
            <input type="checkbox" id="inca" name="cultura" value="inca">
            <label for="inca">Inca (Ollantay / Tradición oral)</label><br>
            <input type="checkbox" id="azteca" name="cultura" value="azteca">
            <label for="azteca">Azteca (Poesía Náhuatl / Nezahualcóyotl)</label><br><br>
            <label>Tipo de texto histórico a consultar:</label><br>
            <input type="radio" id="cronica" name="tipo_texto" value="cronica">
            <label for="cronica">Crónica de Indias (Ej. Cristóbal Colón, Fray Bartolomé)</label><br>
            <input type="radio" id="mito" name="tipo_texto" value="mito">
            <label for="mito">Mito de creación precolombino</label><br><br>
            <label for="archivo_ensayo">Subir ensayo o resumen (PDF / Doc):</label><br>
            <input type="file" id="archivo_ensayo" name="archivo_ensayo"><br><br>
            <label for="color_marcador">Color preferido para resaltar textos:</label>
            <input type="color" id="color_marcador" name="color_marcador" value="#008080"><br><br>
            <input type="submit" value="Enviar información">
            <input type="reset" value="Limpiar formulario">

        </fieldset>
    </form>

</body>
</html>
